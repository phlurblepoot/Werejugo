# A throwaway Immich for the contract tests (.github/workflows/immich-contract.yml).
# Mirrors Immich 3.2.2's official docker-compose.yml, minus machine learning.
# Bump IMMICH_VERSION together with lib/immich/version.ts and the @immich/sdk pin.
name: immich-ci

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.2.2}
    environment:
      DB_PASSWORD: ci-postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    volumes:
      - library:/data
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ci-postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb

volumes:
  library:
