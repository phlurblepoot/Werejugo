name: Publish container images

# Builds the backend and frontend images and pushes them to the GitHub
# Container Registry (GHCR) so they can be installed via unraid's Add Container
# menu. After the first successful run, make both packages public:
#   GitHub → your profile → Packages → werejugo-backend / werejugo-frontend
#   → Package settings → Change visibility → Public.

on:
  push:
    branches: ["claude/laughing-edison-sTVtG", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/werejugo-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build args only matter to the frontend; the backend ignores them.
          build-args: |
            VITE_API_URL=
            VITE_MAP_STYLE_URL=https://tiles.openfreemap.org/styles/liberty
