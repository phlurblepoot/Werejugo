server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow custom icon / overlay image uploads (backend caps at 15 MB).
  client_max_body_size 20m;

  # Reverse-proxy the API to the backend service so the whole app is one origin.
  # `^~` stops the static-asset regex below from hijacking proxied paths.
  location ^~ /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # User-uploaded files (custom icons, map overlays) are served by the backend.
  location ^~ /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA fallback: serve index.html for any unknown path.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
